<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dandelion — Token Generator</title>
    <link rel="stylesheet" href="token-generator.css" />
    <style>
      /* ── topbar ── */
      .topbar {
        border-bottom: 1px solid #2a2a3a;
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(10, 10, 15, 0.85);
        backdrop-filter: blur(8px);
      }
      .topbar-inner {
        max-width: 640px;
        margin: 0 auto;
        padding: 0.7rem 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .topbar-brand {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #e4e4e7;
        text-decoration: none;
        padding: 0.3rem 0;
      }
      .topbar-brand:hover {
        color: #818cf8;
      }
      .topbar-meta {
        display: flex;
        align-items: center;
        gap: 0.85rem;
      }
      .topbar-downloads {
        font-size: 0.8rem;
        color: #a1a1aa;
        white-space: nowrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.55rem 1.2rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .btn-primary {
        background: #6366f1;
        color: #fff;
      }
      .btn-primary:hover {
        background: #5558e6;
      }
      .btn-outline {
        background: transparent;
        color: #e4e4e7;
        border: 1px solid #2a2a3a;
      }
      .btn-outline:hover {
        border-color: #818cf8;
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="topbar-brand" href="/">Dandelion</a>
        <div class="topbar-meta">
          <span class="topbar-downloads" id="total-downloads" hidden></span>
          <a class="btn btn-outline" href="/doc/v1/">Dokumentasi</a>
        </div>
      </div>
    </header>
    <div class="container">
      <header>
        <h1>Dandelion</h1>
        <p class="subtitle">Quota Token Generator</p>
      </header>

      <section class="presets" id="presets" aria-label="Quick presets"></section>

      <form id="tokenForm">
        <div class="field">
          <label>Private Key (PEM)</label>
          <div class="pem-line">
            <span id="pemIndicator"></span>
            <button type="button" id="pastePemBtn">Paste</button>
            <button type="button" id="importPemBtn">Import</button>
          </div>
          <textarea id="privateKey" class="hidden" rows="6"></textarea>
          <input type="file" id="pemFileInput" accept=".pem,.key,.txt" class="hidden" />
        </div>

        <div class="field">
          <label for="tokenId">Token ID <span class="required">*</span></label>
          <input type="text" id="tokenId" required placeholder="e.g. lic_abc12345" />
        </div>

        <div class="row">
          <div class="field">
            <label for="expiry">Expiry</label>
            <input type="text" id="expiry" value="7d" placeholder="90d, 12m, 1y, or 2027-01-01" />
          </div>
          <div class="field">
            <label for="totalLimit">Total Limit (points)</label>
            <input type="number" id="totalLimit" value="40000" min="0" />
          </div>
          <div class="field">
            <label for="dailyLimit">Daily Limit</label>
            <input type="number" id="dailyLimit" value="600" min="0" />
          </div>
        </div>

        <div class="field">
          <label for="versionAllowed">Version Allowed</label>
          <input
            type="text"
            id="versionAllowed"
            value="1.*"
            placeholder="Comma-separated, leave blank for all"
          />
        </div>

        <div class="field">
          <label>Features</label>
          <div class="checkboxes" id="featuresGroup">
            <label class="checkbox"
              ><input type="checkbox" value="skriningform" checked /> skriningform</label
            >
            <label class="checkbox"
              ><input type="checkbox" value="skrining" checked /> skrining</label
            >
            <label class="checkbox"
              ><input type="checkbox" value="zen-mode" checked /> zen-mode</label
            >
            <label class="checkbox"
              ><input type="checkbox" value="registerForm" /> registerForm</label
            >
            <label class="checkbox"><input type="checkbox" value="flashData" /> flashData</label>
            <label class="checkbox"
              ><input type="checkbox" value="skrining-send" /> skrining-send</label
            >
          </div>
        </div>

        <button type="submit" id="generateBtn">Generate Token</button>
      </form>

      <div id="output" class="hidden">
        <h2>Generated Token</h2>
        <div class="output-row">
          <textarea id="jwtOutput" rows="4" readonly></textarea>
          <button id="copyBtn">Copy</button>
          <button id="sendBtn">Send</button>
        </div>
        <div id="shareResult" class="hidden">
          <div class="share-link-row">
            <span class="share-label">Link:</span>
            <input type="text" id="shareUrl" readonly />
            <button id="copyShareBtn">Copy Link</button>
          </div>
          <p id="shareInfo" class="share-info"></p>
        </div>
        <div id="summary" class="summary"></div>
      </div>
    </div>

    <script type="module" src="token-generator.js"></script>

    <script>
      (async () => {
        try {
          const res = await fetch('/api/download-stats');
          if (!res.ok) throw new Error('Not found');
          const { downloads } = await res.json();
          const total = Object.values(downloads ?? {}).reduce((sum, count) => sum + count, 0);
          if (total === 0) throw new Error('No downloads');
          const el = document.getElementById('total-downloads');
          el.textContent = `${total.toLocaleString('id-ID')} terinstall`;
          el.hidden = false;
        } catch {}
      })();
    </script>
  </body>
</html>
